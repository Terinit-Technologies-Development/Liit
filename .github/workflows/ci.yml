name: LIIT Foundation Quality CI

on:
  push:
    branches: [ main, chore/liit-app-foundation ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Application Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx}" "app/**/*.{ts,tsx}"

      - name: Run ESLint Type Linter
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Component Tests
        run: npm run test -- --ci --maxWorkers=2
