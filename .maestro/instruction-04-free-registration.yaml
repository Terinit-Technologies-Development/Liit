appId: com.liit.app
tags:
  - instruction-04
---
# Instruction 4 — Free Registration Journey
# UNEXECUTED: Maestro runner and device emulator not available in this environment.
# This file is structurally valid and targets the correct appId and test IDs.

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "tab-explore"

- waitForAnimationToEnd

# Soweto Street Food & Craft Market is a free event
- scrollUntilVisible:
    element:
      text: "Soweto Street Food & Craft Market"
    direction: DOWN

- tapOn:
    text: "Soweto Street Food & Craft Market"

- waitForAnimationToEnd

- assertVisible:
    text: "Register Free"

- tapOn:
    id: "sticky-action-bar-primary"

- waitForAnimationToEnd

# — Ticket Selection (free flow) —
- assertVisible:
    text: "Register"

- assertVisible:
    text: "Free Registration"

- tapOn:
    id: "ticket-tier-tier-free-registration-increment"

- tapOn:
    id: "checkout-tickets-continue"

- waitForAnimationToEnd:
    timeout: 5000

# — Result screen — free success —
- assertVisible:
    id: "result-headline"

- assertVisible:
    text: "Registration confirmed!"

- assertVisible:
    id: "result-entry-requirement"

- assertVisible:
    id: "result-view-ticket"

- tapOn:
    id: "result-go-to-wallet"

- waitForAnimationToEnd

# — Wallet —
- assertVisible:
    text: "My Wallet"

- assertVisible:
    text: "Soweto Street Food"
