appId: com.liit.app
---
# 1. Incomplete onboarding routing validation
- launchApp:
    clearState: true
- assertVisible: "LIIT Onboarding"
- tapOn: "Enter LIIT Prototype Shell"

# 2. Completed onboarding routing -> Consumer shell
- assertVisible: "Feed"
- assertVisible: "Consumer Feed"

# 3. Consumer shell navigation
- tapOn: "Explore"
- assertVisible: "Explore & Search"
- tapOn: "Map"
- assertVisible: "Interactive Event Map"
- tapOn: "Tickets"
- assertVisible: "Owned Tickets Wallet"
- tapOn: "Profile"
- assertVisible: "Consumer Profile & Settings"

# 4. Opening Prototype Controls
- tapOn: "Open Prototype Controls"
- assertVisible: "Prototype Controls"

# 5. Scenario selection
- tapOn: "Offline State"
- assertVisible: "Deterministic Scenario Overrides"

# 6. Switching to Creator mode
- tapOn: "Creator Mode"
- tapOn: "Close controls"

# 7. Creator shell navigation
- assertVisible: "Dashboard"
- assertVisible: "Creator Dashboard"
- tapOn: "Create"
- assertVisible: "Event Creation Builder"
- tapOn: "Events"
- assertVisible: "Hosted Events & Drafts"
- tapOn: "Tools"
- assertVisible: "Host & Venue Tools"
- tapOn: "Profile"
- assertVisible: "Creator Brand Profile"

# 8. Prototype reset
- tapOn: "Open Prototype Controls"
- tapOn: "Reset All Prototype State"
- tapOn: "Close controls"
- assertVisible: "Consumer Feed"

# 9. State persistence after application restart
- stopApp
- launchApp
- assertVisible: "Consumer Feed"
